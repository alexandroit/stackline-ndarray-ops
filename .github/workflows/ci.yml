name: CI

on:
  push:
    branches: [main]
    tags: ['stackline-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, types, coverage, audits, closure, and package quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: mkdir artifact
      - run: npm pack --ignore-scripts --pack-destination artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: artifact/*.tgz
          if-no-files-found: error
          retention-days: 14

  runtime:
    name: Node.js ${{ matrix.node }} packed consumer
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.20.8, 20.20.2, 22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifact
      - run: node scripts/ci-packed-consumer.cjs artifact

  platform:
    name: ${{ matrix.os }} packed consumer
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:differential
      - run: npm run test:browser
      - run: mkdir artifact
      - run: npm pack --ignore-scripts --pack-destination artifact
      - run: node scripts/ci-packed-consumer.cjs artifact

  source-integrity:
    name: Upstream source and MIT attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: grep -F 'Copyright (c) 2013 Mikola Lysenko' LICENSE
      - run: grep -F 'ndarray-ops@1.2.2' THIRD_PARTY_LICENSES.md
      - run: grep -F 'DefinitelyTyped ndarray-ops declarations' THIRD_PARTY_LICENSES.md
